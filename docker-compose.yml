services:
  report-service:
    build: .
    image: estima-report-service:latest
    container_name: estima-report-service
    ports:
      - "8000:8000"
    environment:
      REPORTS_DIR: /data/reports
      DEFAULT_TEMPLATE: default
      DEFAULT_LANGUAGE: en
      # Optional: set the public base URL used in returned links.
      # PUBLIC_BASE_URL: http://localhost:8000
    volumes:
      - reports-data:/data/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  reports-data:
